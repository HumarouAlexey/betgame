const t = (lang, key, ...args) => {
  const entry = (STRINGS[lang] || STRINGS.en)[key];
  return typeof entry === 'function' ? entry(...args) : entry;
};

const BetForm = ({ player, onBet, error, lang }) => {
  const [amount, setAmount] = useState('');
  if (!player) return null;
  const maxBet = Math.floor(player.money / 2);
  const parsed = parseInt(amount) || 0;
  const canBet = maxBet >= MIN_BET;
  const validAmount = canBet && parsed >= MIN_BET && parsed <= maxBet;
  return (
    <div className="bg-gray-50 p-4 rounded-lg mb-6">
      <p className="font-semibold mb-3">{t(lang, 'betFormPrompt', player.name, player.money)}</p>
      {canBet ? (
        <>
          <div className="flex gap-2">
            <input
              type="number"
              placeholder={t(lang, 'amountPlaceholder')}
              min={MIN_BET}
              max={maxBet}
              value={amount}
              onChange={(e) => setAmount(e.target.value)}
              className="flex-1 px-3 py-2 border rounded"
            />
            <button
              onClick={() => onBet(true, parsed)}
              disabled={!validAmount}
              className="px-4 py-2 bg-green-500 text-white rounded hover:bg-green-600 font-semibold disabled:bg-gray-300 disabled:cursor-not-allowed"
            >
              {t(lang, 'yes')}
            </button>
            <button
              onClick={() => onBet(false, parsed)}
              disabled={!validAmount}
              className="px-4 py-2 bg-red-500 text-white rounded hover:bg-red-600 font-semibold disabled:bg-gray-300 disabled:cursor-not-allowed"
            >
              {t(lang, 'no')}
            </button>
          </div>
          <p className="text-xs text-gray-500 mt-1">{t(lang, 'minMaxBet', MIN_BET, maxBet)}</p>
        </>
      ) : (
        <p className="text-sm text-red-600">{t(lang, 'notEnoughForMinBet', MIN_BET)}</p>
      )}
      {error && <p className="text-xs text-red-600 mt-1">{error}</p>}
    </div>
  );
};

      try {

        ta.value = url;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      } catch (e2) {}
    }
    setCopiedId(playerId);
    setTimeout(() => setCopiedId(prev => (prev === playerId ? null : prev)), 2000);

        if (!res.ok) throw new Error('not found');
        const data = await res.json();
        if (!cancelled) {

          setApiError(null);
        }
      } catch (e) {
        if (!cancelled) setApiError(t(lang, 'connectionError'));
      } finally {
        if (!cancelled) setLoading(false);
      }
    };
    refresh();
    const interval = setInterval(refresh, 1500);
    return () => { cancelled = true; clearInterval(interval); };

  const audioCtxRef = React.useRef(null);
  const getAudioCtx = () => {
    try {
      if (!audioCtxRef.current) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return null;
        audioCtxRef.current = new Ctx();
      }
      if (audioCtxRef.current.state === 'suspended') {
        audioCtxRef.current.resume().catch(() => {});
      }
      return audioCtxRef.current;
    } catch (e) {
      return null;
    }
  };
  const playTimeUpSound = () => {
    const ctx = getAudioCtx();
    if (!ctx) return;
    try {
      const startTime = ctx.currentTime;
      [880, 1108.73, 1318.51].forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        const noteStart = startTime + i * 0.15;
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0, noteStart);
        gain.gain.linearRampToValueAtTime(0.3, noteStart + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, noteStart + 0.35);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(noteStart);
        osc.stop(noteStart + 0.4);
      });
    } catch (e) {}
  };

      endGameTriggeredRef.current = true;
      playTimeUpSound();
      endGame();

      if (!res.ok) {

      setGs(data);
      setApiError(null);
      return { data };
    } catch (e) {
      setApiError(t(lang, 'connectionError'));
      return { error: t(lang, 'networkError') };
    }
  };

          numPlayers: localSetup.numPlayers,
          gameTimeMinutes: localSetup.gameTime,
          playerNames: localSetup.playerNames

      if (!res.ok) {
        setApiError(data.error || t(lang, 'couldNotCreateGame'));
        return;

      setGameId(data.gameId);
      setGs(data.state);
      setAdminToken(data.adminToken);

      url.searchParams.set('g', data.gameId);
      url.searchParams.set('a', data.adminToken);
      window.history.replaceState(null, '', url.toString());
    } catch (e) {
      setApiError(t(lang, 'cantReachIsItRunning'));
    }

                    +

            {t(lang, 'playAgain')}
          </button>
        </div>

    const betsCount = gs.betsCount || 0;

                  <span className="font-bold text-lg">{formatTime(timeLeft)}</span>

                <button

                  className="px-3 py-1.5 bg-red-500 text-white text-sm rounded-lg hover:bg-red-600 disabled:bg-gray-300 disabled:cursor-not-allowed"

                  {t(lang, 'endGame')}

                  </button>
                  {!iAmCurrent && (
                    <p className="text-xs text-gray-500 text-center mt-2">{t(lang, 'waitingContinue', currentPlayer.name)}</p>
                  )}
                </div>
              )}
            </div>
          )}
        </div>
      </div>
    );
  }

  return (
    <>
      <LanguageSwitcher lang={lang} setLang={setLang} />
      {content}
    </>
  );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<BetYouCantGame />);
</script>
</body>
</html>
