const BetForm = ({ player, onBet, error }) => {
  const [amount, setAmount] = useState('');
  if (!player) return null;
  const maxBet = Math.floor(player.money / 2);
  return (
    <div className="bg-gray-50 p-4 rounded-lg mb-6">
      <p className="font-semibold mb-3">{player.name}, place your bet (€{player.money} available):</p>
      <div className="flex gap-2">
        <input
          type="number"
          placeholder="Amount"
          min="1"
          max={maxBet}
          value={amount}
          onChange={(e) => setAmount(e.target.value)}
          className="flex-1 px-3 py-2 border rounded"
        />
        <button
          onClick={() => onBet(true, parseInt(amount) || 0)}
          className="px-4 py-2 bg-green-500 text-white rounded hover:bg-green-600 font-semibold"
        >
          YES
        </button>
        <button
          onClick={() => onBet(false, parseInt(amount) || 0)}
          className="px-4 py-2 bg-red-500 text-white rounded hover:bg-red-600 font-semibold"
        >
          NO
        </button>
      </div>
      <p className="text-xs text-gray-500 mt-1">Max bet: €{maxBet}</p>
      {error && <p className="text-xs text-red-600 mt-1">{error}</p>}
    </div>
  );
};

      if (!res.ok) {
        setApiError(data.error || 'Could not create the game');
        return;

      setGameId(data.gameId);
      setGs(data.state);
      setAdminToken(data.adminToken);
      const url = new URL(window.location.href);
      url.searchParams.set('g', data.gameId);
      url.searchParams.set('a', data.adminToken);

              <line x1="0" y1="22" x2="30" y2="10" stroke="#333" strokeWidth="3"/>
              <line x1="0" y1="22" x2="-20" y2="15" stroke="#333" strokeWidth="3"/>
            </g>
            
            {/* Glass */}
            <g transform="translate(130, 70)">
              <path d="M -5,0 L -8,15 L 8,15 L 5,0 Z" fill="#87CEEB" stroke="#333" strokeWidth="2"/>
            </g>
            
            {/* Throw path */}
            <path d="M 135 75 Q 180 120, 200 260" stroke="#2196F3" strokeWidth="3" fill="none" strokeDasharray="5,5" markerEnd="url(#arrowhead11)"/>
            
            {/* Glass landed */}
            <g transform="translate(200, 270)">
              <path d="M -5,0 L -8,15 L 8,15 L 5,0 Z" fill="#87CEEB" stroke="#333" strokeWidth="2"/>
              <text x="0" y="30" textAnchor="middle" fontSize="12" fill="#4CAF50">✓Safe!</text>
            </g>
            
            {/* Floor */}
            <line x1="50" y1="280" x2="350" y2="280" stroke="#666" strokeWidth="3"/>
            
            {/* Height marker */}
            <line x1="350" y1="80" x2="350" y2="280" stroke="#ff0000" strokeWidth="2" strokeDasharray="4"/>
            <text x="360" y="180" fontSize="12" fill="#ff0000">3m</text>
            
            <defs>
              <marker id="arrowhead11" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
                <polygon points="0 0, 10 5, 0 10" fill="#2196F3"/>
              </marker>
            </defs>
          </svg>
          <p className="text-center text-sm text-gray-600 mt-2">Throw glass from 3m height - it must not break!</p>
        </div>
      );
    }
    
    if (diagramType === 'cupbounce') {
      return (
        <div className="bg-white p-4 rounded-lg border-2 border-gray-300 mb-4">
          <svg viewBox="0 0 400 250" className="w-full h-auto">
            {/* Hand throwing */}
            <g transform="translate(80, 120)">
              <ellipse cx="0" cy="0" rx="20" ry="15" fill="#ffc107" stroke="#333" strokeWidth="2"/>
            </g>
            
            {/* Cup being thrown */}
            <g transform="translate(100, 100)">
              <path d="M -8,0 L -10,15 L 10,15 L 8,0 Z" fill="#4fc3f7" stroke="#333" strokeWidth="2"/>
            </g>
            
            {/* Throw path */}
            <path d="M 105 105 Q 180 160, 250 200" stroke="#2196F3" strokeWidth="3" fill="none" strokeDasharray="5,5" markerEnd="url(#arrowhead12)"/>
            
            {/* Cup landed upright */}
            <g transform="translate(250, 195)">
              <path d="M -8,0 L -10,15 L 10,15 L 8,0 Z" fill="#4fc3f7" stroke="#333" strokeWidth="2"/>
              <text x="0" y="30" textAnchor="middle" fontSize="12" fill="#4CAF50">Upright!</text>
            </g>
            
            {/* Floor */}
            <line x1="50" y1="210" x2="350" y2="210" stroke="#666" strokeWidth="3"/>
            
            <defs>
              <marker id="arrowhead12" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
                <polygon points="0 0, 10 5, 0 10" fill="#2196F3"/>
              </marker>
            </defs>
          </svg>
          <p className="text-center text-sm text-gray-600 mt-2">Throw cup to land upright (2 out of 4 tries)</p>
        </div>
      );
    }
    
    return null;
  };

  if (apiError && !gs) {
    return (
      <div className="min-h-screen bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center p-4">
        <div className="bg-white rounded-xl shadow-2xl p-8 max-w-md w-full text-center">
          <h1 className="text-2xl font-bold mb-3 text-purple-600">Can't reach the game</h1>
          <p className="text-gray-600 mb-6">{apiError}</p>
          <button
            onClick={() => window.location.reload()}
            className="w-full bg-purple-600 text-white py-3 rounded-lg font-bold text-lg hover:bg-purple-700 transition"
          >
            Retry
          </button>
        </div>
      </div>
    );
  }

  if (loading && !gs) {
    return (
      <div className="min-h-screen bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center p-4">
        <p className="text-white text-lg font-semibold">Loading game…</p>
      </div>
    );
  }

  if (!gs) {
    return (
      <div className="min-h-screen bg-gradient-to-br from-purple-600 to-blue-600 flex items-center justify-center p-4">
        <div className="bg-white rounded-xl shadow-2xl p-8 max-w-md w-full">
          <h1 className="text-4xl font-bold text-center mb-6 text-purple-600">Bet You Can't!</h1>

          {localSetup.setupStep === 'config' && (
            <div className="space-y-6">
              <div>
                <label className="block text-gray-700 font-semibold mb-2">Number of Players (3-8)</label>
                <div className="flex items-center gap-3">
                  <button
                    type="button"
                    onClick={() => setLocalSetup(prev => {
                      const n = Math.max(3, prev.numPlayers - 1);
                      return { ...prev, numPlayers: n, playerNames: Array.from({ length: n }, (_, i) => prev.playerNames[i] || '') };
                    })}
                    disabled={localSetup.numPlayers <= 3}
                    className="w-12 h-12 shrink-0 flex items-center justify-center text-2xl font-bold bg-purple-100 text-purple-700 rounded-lg hover:bg-purple-200 active:bg-purple-300 disabled:opacity-40 disabled:hover:bg-purple-100"
                  >
                    −
                  </button>
                  <span className="flex-1 text-center text-2xl font-bold text-gray-800">{localSetup.numPlayers}</span>
                  <button
                    type="button"
                    onClick={() => setLocalSetup(prev => {
                      const n = Math.min(8, prev.numPlayers + 1);
                      return { ...prev, numPlayers: n, playerNames: Array.from({ length: n }, (_, i) => prev.playerNames[i] || '') };
                    })}
                    disabled={localSetup.numPlayers >= 8}
                    className="w-12 h-12 shrink-0 flex items-center justify-center text-2xl font-bold bg-purple-100 text-purple-700 rounded-lg hover:bg-purple-200 active:bg-purple-300 disabled:opacity-40 disabled:hover:bg-purple-100"
                  >
                    +
                  </button>
                </div>
              </div>

              <div>
                <label className="block text-gray-700 font-semibold mb-2">Game Duration (minutes)</label>
                <div className="flex items-center gap-3">
                  <button
                    type="button"
                    onClick={() => setLocalSetup(prev => ({ ...prev, gameTime: Math.max(10, prev.gameTime - 5) }))}
                    disabled={localSetup.gameTime <= 10}
                    className="w-12 h-12 shrink-0 flex items-center justify-center text-2xl font-bold bg-purple-100 text-purple-700 rounded-lg hover:bg-purple-200 active:bg-purple-300 disabled:opacity-40 disabled:hover:bg-purple-100"
                  >
                    −
                  </button>
                  <span className="flex-1 text-center text-2xl font-bold text-gray-800">{localSetup.gameTime}</span>
                  <button
                    type="button"
                    onClick={() => setLocalSetup(prev => ({ ...prev, gameTime: Math.min(60, prev.gameTime + 5) }))}
                    disabled={localSetup.gameTime >= 60}
                    className="w-12 h-12 shrink-0 flex items-center justify-center text-2xl font-bold bg-purple-100 text-purple-700 rounded-lg hover:bg-purple-200 active:bg-purple-300 disabled:opacity-40 disabled:hover:bg-purple-100"
                  >
                    +
                  </button>
                </div>
              </div>

              <button
                onClick={() => setLocalSetup(prev => ({ ...prev, setupStep: 'names' }))}
                className="w-full bg-purple-600 text-white py-3 rounded-lg font-bold text-lg hover:bg-purple-700 transition"
              >
                Next: Set Player Names
              </button>

              <div className="p-4 bg-purple-50 rounded-lg text-sm text-gray-700">
                <p className="font-semibold mb-2">How to Play:</p>
                <ul className="list-disc list-inside space-y-1">
                  <li>Roll dice and move around the board</li>
                  <li>Complete skill or mental challenges</li>
                  <li>Bet on whether others will succeed</li>
                  <li>Collect the most money to win!</li>
                </ul>
              </div>
            </div>
          )}

          {localSetup.setupStep === 'names' && (
            <div className="space-y-6">
              <button
                onClick={() => setLocalSetup(prev => ({ ...prev, setupStep: 'config' }))}
                className="text-purple-600 hover:text-purple-700 font-semibold mb-2"
              >
                ← Back
              </button>

              <h2 className="text-2xl font-bold text-gray-800 mb-4">Enter Player Names</h2>

              <div className="space-y-3">
                {Array.from({ length: localSetup.numPlayers }).map((_, index) => (
                  <div key={index}>
                    <label className="block text-gray-700 font-semibold mb-1">Player {index + 1}</label>
                    <input
                      type="text"
                      value={localSetup.playerNames[index] || ''}
                      onChange={(e) => {
                        const names = [...localSetup.playerNames];
                        names[index] = e.target.value;
                        setLocalSetup(prev => ({ ...prev, playerNames: names }));
                      }}
                      placeholder={`Player ${index + 1}`}
                      className="w-full px-4 py-2 border-2 border-purple-300 rounded-lg focus:border-purple-500 outline-none"
                    />
                  </div>
                ))}
              </div>

              <button
                onClick={createGame}
                className="w-full bg-purple-600 text-white py-3 rounded-lg font-bold text-lg hover:bg-purple-700 transition"
              >
                Create Game
              </button>

              <p className="text-sm text-gray-500 text-center">Leave blank to use default names</p>
            </div>
          )}
          {apiError && <p className="text-red-600 text-sm text-center mt-3">{apiError}</p>}
        </div>
      </div>
    );
  }

  if (gs.phase === 'lobby') {
    const isMe = myPlayerId !== null && gs.players[myPlayerId];
    return (
      <div className="min-h-screen bg-gradient-to-br from-purple-600 to-blue-600 p-4">
        <div className="max-w-2xl mx-auto bg-white rounded-xl shadow-2xl p-6 sm:p-8">
          <h1 className="text-3xl font-bold text-center mb-2 text-purple-600">Bet You Can't!</h1>
          <p className="text-center text-gray-600 mb-6">
            Each player scans their own QR code (or taps their name below) on their own phone. Only the host can start the game once everyone's in.
          </p>

          {isMe ? (
            <div className="bg-green-50 border-2 border-green-400 rounded-lg p-4 mb-6 text-center">
              <p className="font-bold text-green-700">You're in as {gs.players[myPlayerId].name} ✅</p>
            </div>
          ) : renderJoinBar()}

          <div className="grid sm:grid-cols-2 gap-4 mb-6">
            {gs.players.map(p => (
              <div key={p.id} className="border-2 border-purple-200 rounded-lg p-4 text-center">
                <p className="font-semibold mb-2">{p.name}</p>
                <img
                  src={getQrImageUrl(getShareUrl(p.id))}
                  alt={`QR code for ${p.name}`}
                  className="mx-auto mb-2 rounded"
                  width={140}
                  height={140}
                />
                <button
                  onClick={() => copyLink(p.id)}
                  className="w-full mb-2 px-3 py-1.5 bg-purple-100 text-purple-700 text-sm font-semibold rounded-lg hover:bg-purple-200"
                >
                  {copiedId === p.id ? 'Copied ✓' : 'Copy Link'}
                </button>
                <p className="text-xs text-gray-500 break-all">{getShareUrl(p.id)}</p>
              </div>
            ))}
          </div>

          {isAdmin ? (
            <button
              onClick={startTheGame}
              className="w-full bg-purple-600 text-white py-3 rounded-lg font-bold text-lg hover:bg-purple-700 transition"
            >
              Start Game ▶
            </button>
          ) : (
            <div className="w-full bg-gray-100 text-gray-600 py-3 rounded-lg font-semibold text-center">
              Waiting for the host to start the game…
            </div>
          )}
          {apiError && <p className="text-red-600 text-sm text-center mt-3">{apiError}</p>}
          <p className="text-xs text-gray-400 text-center mt-4">
            Players need to be on the same WiFi network as this server (or reach its address over the internet).
          </p>
        </div>
      </div>
    );
  }

  if (gs.phase === 'gameOver') {
    const winner = gs.players.reduce((prev, current) => (current.money > prev.money ? current : prev));
    return (
      <div className="min-h-screen bg-gradient-to-br from-yellow-400 to-orange-500 flex items-center justify-center p-4">
        <div className="bg-white rounded-xl shadow-2xl p-8 max-w-2xl w-full">
          <div className="text-center mb-8">
            <div className="text-6xl mb-4">🏆</div>
            <h1 className="text-4xl font-bold text-gray-800 mb-2">Game Over!</h1>
            <h2 className="text-2xl text-purple-600">Winner: {winner.name}</h2>
          </div>

          <div className="space-y-3">
            {[...gs.players]
              .sort((a, b) => b.money - a.money)
              .map((player, index) => (
                <div key={player.id} className="flex items-center justify-between bg-gray-50 p-4 rounded-lg">
                  <div className="flex items-center gap-3">
                    <span className="text-2xl font-bold text-gray-400">#{index + 1}</span>
                    <span className="font-semibold">{player.name}</span>
                  </div>
                  <span className="text-xl font-bold text-green-600">€{player.money}</span>
                </div>
              ))}
          </div>

          <button
            onClick={() => window.location.href = window.location.origin + window.location.pathname}
            className="w-full mt-8 bg-purple-600 text-white py-3 rounded-lg font-bold hover:bg-purple-700 transition"
          >
            Play Again
          </button>
        </div>
      </div>
    );
  }

  const currentTask = currentTaskObject(gs);
  const currentPlayer = gs.players[gs.currentPlayerIndex];
  const timeLeft = gs.gameEndsAt ? Math.max(0, Math.round((gs.gameEndsAt - now) / 1000)) : 0;
  const challengeTimeLeft = gs.performEndsAt
    ? Math.max(0, Math.ceil((gs.performEndsAt - now) / 1000))
    : (currentTask ? currentTask.time : null);
  const iAmCurrent = myPlayerId === gs.currentPlayerIndex;
  const otherPlayers = gs.players.filter((_, i) => i !== gs.currentPlayerIndex);
  const betsCount = gs.betsCount || 0;
  const betPlacedBy = gs.betPlacedBy || [];
  const betsNeeded = gs.players.length - 1;
  const myBet = myPlayerId !== null ? (gs.bets || {})[myPlayerId] : undefined;

  return (
    <div className="min-h-screen bg-gradient-to-br from-blue-500 to-purple-600 p-4">
      <div className="max-w-3xl mx-auto">
        <div className="bg-white rounded-xl shadow-2xl p-4 sm:p-6 mb-4">
          <div className="flex flex-wrap justify-between items-center gap-3">
            <h1 className="text-2xl sm:text-3xl font-bold text-purple-600">Bet You Can't!</h1>
            <div className="flex items-center gap-3 flex-wrap">
              <div className="flex items-center gap-2">
                <span>⏱️</span>
                <span className="font-bold text-lg">{formatTime(timeLeft)}</span>
              </div>
              <button
                onClick={endGame}
                className="px-3 py-1.5 bg-red-500 text-white text-sm rounded-lg hover:bg-red-600"
              >
                End Game
              </button>
            </div>
          </div>
          {renderJoinBar()}
          {apiError && <p className="text-red-600 text-sm text-center mt-2">{apiError}</p>}
        </div>

        <div className="flex gap-2 overflow-x-auto pb-2 mb-4">
          {gs.players.map((player, index) => (
            <div
              key={player.id}
              className={`flex-shrink-0 bg-white rounded-lg p-3 min-w-[110px] ${index === gs.currentPlayerIndex ? 'ring-4 ring-yellow-400' : ''} ${myPlayerId === index ? 'border-2 border-purple-500' : ''}`}
            >
              <div className="flex items-center gap-1 mb-1">
                <span className="text-xs">👤</span>
                <span className="font-semibold text-xs truncate">{player.name}</span>
              </div>
              <div className="text-lg font-bold text-green-600">€{player.money}</div>
            </div>
          ))}
        </div>

        {gs.phase === 'playing' && (
          <div className="bg-white rounded-xl shadow-xl p-8 text-center">
            <h2 className="text-2xl font-bold mb-4">
              {iAmCurrent ? 'Your turn!' : `${currentPlayer.name}'s Turn`}
            </h2>

            {gs.diceValue && (
              <div className="mb-6">
                <div className="text-7xl mb-2">{diceFaces[gs.diceValue - 1]}</div>
                <p className="text-xl">Rolled: {gs.diceValue}</p>
              </div>
            )}

            <button
              onClick={rollDice}
              disabled={gs.diceValue !== null}
              className="px-8 py-4 bg-purple-600 text-white text-xl font-bold rounded-lg hover:bg-purple-700 disabled:bg-gray-400 disabled:cursor-not-allowed transition"
            >
              Roll Dice
            </button>
            {!iAmCurrent && (
              <p className="text-sm text-gray-500 mt-4">Waiting on {currentPlayer.name} — anyone can roll for them if needed.</p>
            )}
          </div>
        )}

        {gs.phase === 'blindBet' && (
          <div className="bg-white rounded-xl shadow-xl p-8">
            <h2 className="text-2xl font-bold mb-4 text-center">🎲 Blind Bet!</h2>
            <p className="text-center mb-4 text-lg">
              {iAmCurrent ? 'Choose your challenge type:' : `${currentPlayer.name}, choose your challenge type:`}
            </p>
            <p className="text-center mb-6 text-gray-600">
              Other players will bet BEFORE seeing what the challenge is!
            </p>

            <div className="flex gap-4 justify-center">
              <button
                onClick={() => selectBlindBetType('skill')}
                className="px-8 py-4 bg-blue-600 text-white text-xl font-bold rounded-lg hover:bg-blue-700"
              >
                🏃 Skill Task
              </button>
              <button
                onClick={() => selectBlindBetType('mental')}
                className="px-8 py-4 bg-green-600 text-white text-xl font-bold rounded-lg hover:bg-green-700"
              >
                🧠 Mental Task
              </button>
            </div>
          </div>
        )}

        {(gs.phase === 'betting' || gs.phase === 'blindBetting') && (
          <div className="bg-white rounded-xl shadow-xl p-8">
            {gs.phase === 'betting' && currentTask && (
              <>
                <h2 className="text-2xl font-bold mb-4 text-center">
                  {currentTask.type === 'skill' ? '🏃 Skill Challenge' : '🧠 Mental Challenge'}
                </h2>
                <div className="bg-purple-50 p-6 rounded-lg mb-6">
                  <p className="text-xl font-semibold text-center mb-2">{currentTask.text}</p>
                  <p className="text-center text-gray-600">Time limit: {currentTask.time} seconds</p>
                </div>
                {currentTask.diagram && renderDiagram(currentTask.diagram)}
              </>
            )}

            {gs.phase === 'blindBetting' && (
              <>
                <h2 className="text-2xl font-bold mb-4 text-center">🎲 Blind Betting!</h2>
                <p className="text-center mb-2 text-lg">
                  {currentPlayer.name} has chosen a{' '}
                  <span className="font-bold text-purple-600">
                    {gs.blindBetTaskType === 'skill' ? '🏃 Skill' : '🧠 Mental'}
                  </span>{' '}
                  challenge
                </p>
                <p className="text-center mb-6 text-red-600 font-semibold">⚠️ Place your bets WITHOUT knowing the task!</p>
              </>
            )}

            {iAmCurrent ? (
              <div className="bg-blue-50 p-4 rounded-lg mb-6 text-center">
                <p className="font-semibold">Waiting on bets: {betsCount}/{betsNeeded}</p>
              </div>
            ) : myPlayerId === null ? null : myBet ? (
              <div className="bg-green-50 border-2 border-green-400 p-4 rounded-lg mb-6 text-center">
                <p className="font-semibold text-green-700">
                  You bet €{myBet.amount} on {myBet.willSucceed ? 'SUCCESS ✓' : 'FAIL ✗'} — waiting for the others.
                </p>
              </div>
            ) : (
              <BetForm player={gs.players[myPlayerId]} onBet={placeBet} error={betError} />
            )}

            <div className="bg-gray-50 p-4 rounded-lg mb-6">
              <h3 className="font-bold text-lg mb-2">Bets Placed ({betsCount}/{betsNeeded}):</h3>
              <p className="text-xs text-gray-400 mb-2">Bets stay secret until the challenge is judged.</p>
              {otherPlayers.map(player => {
                const hasBet = betPlacedBy.includes(player.id);
                return (
                  <p key={player.id} className="text-gray-700 text-sm">
                    {player.name}: {hasBet ? '✓ bet placed' : 'thinking…'}
                  </p>
                );
              })}
            </div>

            <button
              onClick={gs.phase === 'betting' ? startChallenge : revealBlindTask}
              disabled={betsCount < betsNeeded || !iAmCurrent}
              className="w-full py-3 bg-purple-600 text-white font-bold rounded-lg hover:bg-purple-700 disabled:bg-gray-400"
            >
              {gs.phase === 'betting' ? 'All Bets Placed - Start Challenge!' : 'All Bets Placed - Reveal Challenge!'}
            </button>
            {betsCount >= betsNeeded && !iAmCurrent && (
              <p className="text-xs text-gray-500 text-center mt-2">Waiting for {currentPlayer.name} to continue…</p>
            )}
          </div>
        )}

        {gs.phase === 'revealBlindTask' && currentTask && (
          <div className="bg-white rounded-xl shadow-xl p-8">
            <h2 className="text-2xl font-bold mb-4 text-center">🎉 Challenge Revealed!</h2>

            <div className="bg-yellow-100 border-4 border-yellow-400 p-6 rounded-lg mb-6">
              <p className="text-2xl font-bold text-center mb-2">{currentTask.text}</p>
              <p className="text-center text-gray-700 text-lg">⏱️ Time limit: {currentTask.time} seconds</p>
            </div>

            {currentTask.diagram && renderDiagram(currentTask.diagram)}

            <div className="bg-blue-50 p-4 rounded-lg mb-6">
              <h3 className="font-bold text-lg mb-2">Bets Placed:</h3>
              <p className="text-xs text-gray-400 mb-2">Bets stay secret until the challenge is judged.</p>
              {otherPlayers.map(player => {
                const hasBet = betPlacedBy.includes(player.id);
                return (
                  <p key={player.id} className="text-gray-700">
                    {player.name}: {hasBet ? '✓ bet placed' : '—'}
                  </p>
                );
              })}
            </div>

            <button
              onClick={startChallenge}
              disabled={!iAmCurrent}
              className="w-full py-4 bg-purple-600 text-white font-bold text-lg rounded-lg hover:bg-purple-700 disabled:bg-gray-400"
            >
              Start Challenge! 🎯
            </button>
            {!iAmCurrent && (
              <p className="text-xs text-gray-500 text-center mt-2">Waiting for {currentPlayer.name} to continue…</p>
            )}
          </div>
        )}

        {gs.phase === 'performing' && currentTask && (
          <div className="bg-white rounded-xl shadow-xl p-8">
            <h2 className="text-2xl font-bold mb-4 text-center">
              {iAmCurrent ? "You're performing!" : `${currentPlayer.name} is performing!`}
            </h2>

            <div className="bg-yellow-50 p-6 rounded-lg mb-6">
              <p className="text-xl font-semibold text-center mb-2">{currentTask.text}</p>
              <p className="text-center text-gray-600">
                {challengeTimeLeft !== null ? `${challengeTimeLeft}s left` : `Time limit: ${currentTask.time} seconds`}
              </p>
            </div>

            {!gs.showResults && (
              <>
                <div className="text-center mb-6">
                  <p className="text-lg mb-2">Did {currentPlayer.name} succeed?</p>
                  <p className="text-xs text-gray-400">Anyone can judge — tap the result together.</p>
                </div>

                <div className="flex gap-4 justify-center">
                  <button
                    onClick={() => recordResult(true)}
                    className="px-12 py-4 bg-green-500 text-white text-xl font-bold rounded-lg hover:bg-green-600"
                  >
                    ✓ SUCCESS
                  </button>
                  <button
                    onClick={() => recordResult(false)}
                    className="px-12 py-4 bg-red-500 text-white text-xl font-bold rounded-lg hover:bg-red-600"
                  >
                    ✗ FAILED
                  </button>
                </div>
              </>
            )}

            {gs.showResults && (
              <div className="mt-2 p-4 bg-blue-50 rounded-lg">
                <h3 className="font-bold text-lg mb-2">Results:</h3>
                <p className="text-xl mb-2">Task: {gs.taskSuccess ? '✓ Completed!' : '✗ Failed'}</p>
                {Object.entries(gs.bets || {}).map(([playerId, bet]) => {
                  const player = gs.players[parseInt(playerId)];
                  const won = bet.willSucceed === gs.taskSuccess;
                  return (
                    <p key={playerId} className={won ? 'text-green-600' : 'text-red-600'}>
                      {player.name}: {won ? `+€${bet.amount}` : `-€${bet.amount}`}
                    </p>
                  );
                })}
                <button
                  onClick={nextTurn}
                  disabled={!iAmCurrent}
                  className="w-full mt-4 py-3 bg-purple-600 text-white font-bold rounded-lg hover:bg-purple-700 disabled:bg-gray-400"
                >
                  Continue ▶
                </button>
                {!iAmCurrent && (
                  <p className="text-xs text-gray-500 text-center mt-2">Waiting for {currentPlayer.name} to continue…</p>
                )}
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<BetYouCantGame />);
</script>
</body>
</html>
