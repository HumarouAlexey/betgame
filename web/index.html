const t = (lang, key, ...args) => {
  const entry = (STRINGS[lang] || STRINGS.en)[key];
  return typeof entry === 'function' ? entry(...args) : entry;
};

      className={`px-2.5 py-1 rounded-full transition ${lang === 'en' ? 'bg-purple-600 text-white' : 'text-gray-500 hover:bg-gray-100'}`}
    >
      EN
    </button>
    <button
      onClick={() => setLang('ru')}
      className={`px-2.5 py-1 rounded-full transition ${lang === 'ru' ? 'bg-purple-600 text-white' : 'text-gray-500 hover:bg-gray-100'}`}
    >
      RU
    </button>
  </div>
);

const BetForm = ({ player, onBet, error, lang }) => {
  const [amount, setAmount] = useState('');
  if (!player) return null;
  const maxBet = Math.floor(player.money / 2);
  const parsed = parseInt(amount) || 0;
  const canBet = maxBet >= MIN_BET;
  const validAmount = canBet && parsed >= MIN_BET && parsed <= maxBet;
  return (
    <div className="bg-gray-50 p-4 rounded-lg mb-6">
      <p className="font-semibold mb-3">{t(lang, 'betFormPrompt', player.name, player.money)}</p>
      {canBet ? (
        <>
          <div className="flex gap-2">
            <input
              type="number"
              placeholder={t(lang, 'amountPlaceholder')}
              min={MIN_BET}
              max={maxBet}
              value={amount}
              onChange={(e) => setAmount(e.target.value)}
              className="flex-1 px-3 py-2 border rounded"
            />
            <button
              onClick={() => onBet(true, parsed)}
              disabled={!validAmount}
              className="px-4 py-2 bg-green-500 text-white rounded hover:bg-green-600 font-semibold disabled:bg-gray-300 disabled:cursor-not-allowed"
            >
              {t(lang, 'yes')}
            </button>
            <button
              onClick={() => onBet(false, parsed)}
              disabled={!validAmount}
              className="px-4 py-2 bg-red-500 text-white rounded hover:bg-red-600 font-semibold disabled:bg-gray-300 disabled:cursor-not-allowed"
            >
              {t(lang, 'no')}
            </button>
          </div>
          <p className="text-base font-semibold text-gray-700 mt-2">
            {t(lang, 'minBetLabel')}{' '}
            <button
              onClick={() => setAmount(String(MIN_BET))}
              className="text-blue-600 underline decoration-dotted underline-offset-2 font-bold"
            >
              €{MIN_BET}
            </button>
            {' · '}
            {t(lang, 'maxBetLabel')}{' '}
            <button
              onClick={() => setAmount(String(maxBet))}
              className="text-blue-600 underline decoration-dotted underline-offset-2 font-bold"
            >
              €{maxBet}
            </button>
            <span className="block text-sm font-normal text-gray-500">{t(lang, 'tapAmountHint')}</span>
          </p>
        </>
      ) : (
        <p className="text-sm text-red-600">{t(lang, 'notEnoughForMinBet', MIN_BET)}</p>
      )}
      {error && <p className="text-xs text-red-600 mt-1">{error}</p>}
    </div>
  );
};

    { en: "Can the player name 4 racing series called 'Formula' something, such as Formula 1? No hints, no repeats.", ru: "Сможет ли игрок назвать 4 гоночные серии, в названии которых есть слово «Формула», например Формула-1? Без подсказок, без повторов.", time: 30 },

    { en: "Can the player name 5 different animals you would see in a zoo, in 30 seconds? No hints, no repeats.", ru: "Сможет ли игрок за 30 секунд назвать 5 разных животных, которых можно увидеть в зоопарке? Без подсказок, без повторов.", time: 30 },

    { en: "Can the player recall 2 contacts from their phone by memory, full name and full number? Another player checks them against the phone.", ru: "Сможет ли игрок назвать по памяти 2 контакта из своего телефона — полное имя и полный номер? Другой игрок сверяет их с телефоном.", time: 30 },
    { en: "Can the player name 3 car brands, 2 of which start with the letter C? No hints, no repeats.", ru: "Сможет ли игрок назвать 3 марки автомобилей, две из которых начинаются на букву С? Без подсказок, без повторов.", time: 30 },

    { en: "Can the player name 4 fruits whose English names have exactly 6 letters? No hints, no repeats.", ru: "Сможет ли игрок назвать 4 фрукта, в русском названии которых ровно 6 букв? Без подсказок, без повторов.", time: 30 },
    { en: "Can the player name 6 soft drink brands in 30 seconds? No hints, no repeats.", ru: "Сможет ли игрок за 30 секунд назвать 6 брендов безалкогольных напитков? Без подсказок, без повторов.", time: 30 },

    { en: "Can the player name 10 Disney films in 30 seconds? No hints, no repeats.", ru: "Сможет ли игрок за 30 секунд назвать 10 мультфильмов Disney? Без подсказок, без повторов.", time: 30 },
    { en: "Can the player name a female first name, a male first name and an athlete, all three starting with the letter J? No hints.", ru: "Сможет ли игрок назвать женское имя, мужское имя и спортсмена — все три на букву М? Без подсказок.", time: 30 },
    { en: "Can the player name 10 real radio stations in 30 seconds? No hints, no repeats.", ru: "Сможет ли игрок за 30 секунд назвать 10 реальных радиостанций? Без подсказок, без повторов.", time: 30 },
    { en: "Can the player name 3 fairy tales by Hans Christian Andersen? No hints, no repeats.", ru: "Сможет ли игрок назвать 3 сказки Ганса Христиана Андерсена? Без подсказок, без повторов.", time: 30 },
    { en: "Can the player name 8 comics or comic series in 30 seconds? No hints, no repeats.", ru: "Сможет ли игрок за 30 секунд назвать 8 комиксов или серий комиксов? Без подсказок, без повторов.", time: 30 },
    { en: "Can the player name 10 US states in 30 seconds? No hints, no repeats.", ru: "Сможет ли игрок за 30 секунд назвать 10 штатов США? Без подсказок, без повторов.", time: 30 },
    { en: "Can the player name 8 different things found in a wardrobe in 30 seconds? No hints, no repeats.", ru: "Сможет ли игрок за 30 секунд назвать 8 разных предметов, которые можно найти в шкафу? Без подсказок, без повторов.", time: 30 },
    { en: "Can the player name 6 countries that start with the letter P in 30 seconds? No hints, no repeats.", ru: "Сможет ли игрок за 30 секунд назвать 6 стран на букву П? Без подсказок, без повторов.", time: 30 },
    { en: "Can the player name 6 books in a chain, where each title starts with the last letter of the previous title? No hints.", ru: "Сможет ли игрок назвать 6 книг цепочкой, где название каждой следующей начинается на последнюю букву предыдущего? Без подсказок.", time: 30 },
    { en: "Can the player name 6 people, real or fictional, whose first names start with the letters of the word FRIEND in order (F, R, I, E, N, D)?", ru: "Сможет ли игрок назвать 6 людей — реальных или вымышленных, — чьи имена начинаются на буквы слова ДРУЖБА по порядку (Д, Р, У, Ж, Б, А)?", time: 30 },
    { en: "On a go signal, can the player count time silently and say 'stop' between 55 and 60 seconds, without going over 60? No clocks and no counting out loud.", ru: "Сможет ли игрок по команде молча отсчитать время и сказать «стоп» в промежутке между 55 и 60 секундами, не превысив 60? Смотреть на часы и считать вслух нельзя.", time: 65 },
    { en: "Can the player name 2 fruits whose English names have exactly 5 letters? No hints, no repeats.", ru: "Сможет ли игрок назвать 2 фрукта, в русском названии которых ровно 5 букв? Без подсказок, без повторов.", time: 30 },
    { en: "Can the player name 6 cities in a chain, where each city starts with the last letter of the previous one? No hints.", ru: "Сможет ли игрок назвать 6 городов цепочкой, где каждый следующий начинается на последнюю букву предыдущего? Без подсказок.", time: 30 },
    { en: "Can the player name 5 cities whose English names have exactly 4 letters? No hints, no repeats.", ru: "Сможет ли игрок назвать 5 городов, в русском названии которых ровно 4 буквы? Без подсказок, без повторов.", time: 30 },
    { en: "Can the player name 5 words for baby animals (kitten, foal and so on) in 30 seconds? No hints, no repeats.", ru: "Сможет ли игрок за 30 секунд назвать 5 названий детёнышей животных (котёнок, жеребёнок и так далее)? Без подсказок, без повторов.", time: 30 },
    { en: "Can the player name 4 informal synonyms for the word 'police' in 30 seconds? No hints, no repeats.", ru: "Сможет ли игрок за 30 секунд назвать 4 разговорных синонима слова «полиция»? Без подсказок, без повторов.", time: 30 },
    { en: "Can the player name 3 professional sports teams in 20 seconds? No hints, no repeats.", ru: "Сможет ли игрок за 20 секунд назвать 3 профессиональные спортивные команды? Без подсказок, без повторов.", time: 20 },
    { en: "Can the player name two countries whose flags share no color at all? The other players check the flags.", ru: "Сможет ли игрок назвать две страны, флаги которых не имеют ни одного общего цвета? Остальные игроки проверяют флаги.", time: 30 },
    { en: "Can the player name all 7 months that have exactly 31 days, without naming a wrong one?", ru: "Сможет ли игрок назвать все 7 месяцев, в которых ровно 31 день, не назвав ни одного лишнего?", time: 30 },
    { en: "Can the player name 8 different pieces of furniture in 30 seconds? No hints, no repeats.", ru: "Сможет ли игрок за 30 секунд назвать 8 разных предметов мебели? Без подсказок, без повторов.", time: 30 }
  ];

  const diceFaces = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];

  const byMoneyThenName = (a, b) => b.money - a.money || a.name.localeCompare(b.name);

  const formatTime = (seconds) => {
    const mins = Math.floor(seconds / 60);
    const secs = seconds % 60;
    return `${mins}:${secs.toString().padStart(2, '0')}`;
  };

  // ---- Connection / game identity ----
  // `p` in the URL is a player's long, unguessable secret token (issued by
  // the server via /claim or, for the host, at game creation) — never the
  // player's small array index. That's what stops someone from "becoming"
  // another player just by editing a digit in the URL.
  const params = new URLSearchParams(window.location.search);
  const urlGameId = params.get('g');
  const urlPlayerToken = params.get('p');
  const urlAdminToken = params.get('a');

  const [gameId, setGameId] = useState(urlGameId || null);
  const [myToken, setMyToken] = useState(urlPlayerToken || null);
  // The server resolves our token to our numeric player index on every
  // response (gs.you); we mirror it into state so the rest of the UI can
  // keep indexing gs.players[myPlayerId] as before.
  const [myPlayerId, setMyPlayerId] = useState(null);
  const [adminToken, setAdminToken] = useState(urlAdminToken || null);
  // Only the host receives the real per-player tokens (in the createGame
  // response), used to build everyone's personal join link/QR. Nobody else
  // ever sees another player's token.
  const [playerTokens, setPlayerTokens] = useState([]);
  const isAdmin = !!adminToken;
  const [gs, setGs] = useState(null);
  const [loading, setLoading] = useState(!!urlGameId);
  const [apiError, setApiError] = useState(null);
  const [betError, setBetError] = useState(null);
  const [now, setNow] = useState(Date.now());
  const [localSetup, setLocalSetup] = useState({
    numPlayers: 3,
    gameTime: 30,
    playerNames: ['', '', ''],
    setupStep: 'config'
  });
  const [copiedId, setCopiedId] = useState(null);

  // ---- Host's swipeable player-QR carousel (lobby) ----
  const [qrIndex, setQrIndex] = useState(0);
  const [qrDragX, setQrDragX] = useState(0);
  const [qrDragging, setQrDragging] = useState(false);
  const qrTouchStartX = React.useRef(null);
  const handleQrTouchStart = (e) => {
    qrTouchStartX.current = e.touches[0].clientX;
    setQrDragging(true);
  };
  const handleQrTouchMove = (e) => {
    if (qrTouchStartX.current === null) return;
    setQrDragX(e.touches[0].clientX - qrTouchStartX.current);
  };
  const handleQrTouchEnd = (numPlayers) => {
    const threshold = 50;
    if (qrDragX <= -threshold) {
      setQrIndex(i => Math.min(numPlayers - 1, i + 1));
    } else if (qrDragX >= threshold) {
      setQrIndex(i => Math.max(0, i - 1));
    }
    qrTouchStartX.current = null;
    setQrDragX(0);
    setQrDragging(false);
  };

  const [lang, setLang] = useState(() => {
    try {
      const stored = localStorage.getItem('lang');
      if (stored === 'en' || stored === 'ru') return stored;
    } catch (e) {}
    return (navigator.language || '').toLowerCase().startsWith('ru') ? 'ru' : 'en';
  });

  useEffect(() => {
    try { localStorage.setItem('lang', lang); } catch (e) {}
    document.documentElement.lang = lang;
    document.title = t(lang, 'title');
  }, [lang]);

  const apiBase = () => `${window.location.origin}/api/games`;

  // Appends our own player token (so the server knows which bet, if any, is
  // safe to reveal to us) and the current UI language (for translated
  // server-side error messages).
  const viewerQuery = () => {
    const p = new URLSearchParams();
    if (myToken) p.set('playerId', myToken);
    p.set('lang', lang);
    return `?${p.toString()}`;
  };

  // Claims an unclaimed player slot by tapping its name: the server hands
  // back that player's secret token exactly once (refusing if someone
  // already claimed it), which we then use as our identity going forward.
  const claimPlayer = async (id) => {
    try {
      const res = await fetch(`${apiBase()}/${gameId}/claim?lang=${lang}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ playerId: id })
      });
      const data = await res.json();
      if (!res.ok) {
        setApiError(data.error || t(lang, 'somethingWrong'));
        return;
      }
      setMyToken(data.token);
      const url = new URL(window.location.href);
      url.searchParams.set('p', data.token);
      window.history.replaceState(null, '', url.toString());
    } catch (e) {
      setApiError(t(lang, 'connectionError'));
    }
  };

  // Only meaningful for the host: builds a player's personal join link
  // using the real secret token the server returned at game creation.
  const getShareUrl = (playerId) => {
    const url = new URL(window.location.origin + window.location.pathname);
    url.searchParams.set('g', gameId);
    url.searchParams.set('p', playerTokens[playerId] || '');
    return url.toString();
  };

  const getQrImageUrl = (url) =>
    `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(url)}`;

  const copyLink = async (playerId) => {
    const url = getShareUrl(playerId);
    try {
      await navigator.clipboard.writeText(url);
    } catch (e) {
      try {
        const ta = document.createElement('textarea');
        ta.value = url;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      } catch (e2) {}
    }
    setCopiedId(playerId);
    setTimeout(() => setCopiedId(prev => (prev === playerId ? null : prev)), 2000);
  };

  // ---- Polling ----
  useEffect(() => {
    if (!gameId) return;
    let cancelled = false;
    const refresh = async () => {
      try {
        const res = await fetch(`${apiBase()}/${gameId}${viewerQuery()}`);
        if (!res.ok) throw new Error('not found');
        const data = await res.json();
        if (!cancelled) {
          setGs(data);
          setApiError(null);
        }
      } catch (e) {
        if (!cancelled) setApiError(t(lang, 'connectionError'));
      } finally {
        if (!cancelled) setLoading(false);
      }
    };
    refresh();
    const interval = setInterval(refresh, 1500);
    return () => { cancelled = true; clearInterval(interval); };
  }, [gameId, myToken, lang]);

  // Mirrors the server-resolved player index (gs.you, derived from our
  // secret token) into local state so the rest of the UI can keep indexing
  // gs.players[myPlayerId] as before.
  useEffect(() => {
    if (gs && gs.you !== null && gs.you !== undefined) {
      setMyPlayerId(gs.you);
    }
  }, [gs]);

  useEffect(() => {
    const tickInterval = setInterval(() => setNow(Date.now()), 1000);
    return () => clearInterval(tickInterval);
  }, []);

  // Web Audio beep — no external audio file needed, keeps the app self-contained.
  const audioCtxRef = React.useRef(null);
  const getAudioCtx = () => {
    try {
      if (!audioCtxRef.current) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return null;
        audioCtxRef.current = new Ctx();
      }
      if (audioCtxRef.current.state === 'suspended') {
        audioCtxRef.current.resume().catch(() => {});
      }
      return audioCtxRef.current;
    } catch (e) {
      return null;
    }
  };
  const playTimeUpSound = () => {
    const ctx = getAudioCtx();
    if (!ctx) return;
    try {
      const startTime = ctx.currentTime;
      // A struck gong: every partial starts at once on a near-instant attack,
      // then rings out. The upper ones fade first, which is what makes the
      // strike read as a metallic hit rather than a held chord.
      [
        { freq: 220, peak: 0.35, decay: 1.8 },
        { freq: 330, peak: 0.18, decay: 1.4 },
        { freq: 660, peak: 0.07, decay: 0.5 },
      ].forEach(({ freq, peak, decay }) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0, startTime);
        gain.gain.linearRampToValueAtTime(peak, startTime + 0.005);
        gain.gain.exponentialRampToValueAtTime(0.001, startTime + decay);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(startTime);
        osc.stop(startTime + decay + 0.05);
      });
    } catch (e) {}
  };

  const endGameTriggeredRef = React.useRef(false);
  useEffect(() => {
    if (!gs || gs.phase === 'gameOver' || gs.phase === 'lobby' || !gs.gameEndsAt) return;
    if (now >= gs.gameEndsAt && !endGameTriggeredRef.current) {
      endGameTriggeredRef.current = true;
      playTimeUpSound();
      endGame();
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [now, gs]);

  const performAlertedRef = React.useRef(null);
  useEffect(() => {
    if (!gs || gs.phase !== 'performing' || !gs.performEndsAt) return;
    if (now >= gs.performEndsAt && performAlertedRef.current !== gs.performEndsAt) {
      performAlertedRef.current = gs.performEndsAt;
      playTimeUpSound();
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [now, gs]);

  const post = async (path, body) => {
    try {
      const res = await fetch(`${apiBase()}/${gameId}${path}${viewerQuery()}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body || {})
      });
      const data = await res.json();
      if (!res.ok) {
        return { error: data.error || t(lang, 'somethingWrong') };
      }
      setGs(data);
      setApiError(null);
      return { data };
    } catch (e) {
      setApiError(t(lang, 'connectionError'));
      return { error: t(lang, 'networkError') };
    }
  };

  const createGame = async () => {
    try {
      const res = await fetch(`${apiBase()}/${viewerQuery()}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          numPlayers: localSetup.numPlayers,
          gameTimeMinutes: localSetup.gameTime,
          playerNames: localSetup.playerNames
        })
      });
      const data = await res.json();
      if (!res.ok) {
        setApiError(data.error || t(lang, 'couldNotCreateGame'));
        return;
      }
      setGameId(data.gameId);
      setGs(data.state);
      setAdminToken(data.adminToken);
      setPlayerTokens(data.playerTokens || []);
      const url = new URL(window.location.href);
      url.searchParams.set('g', data.gameId);
      url.searchParams.set('a', data.adminToken);
      window.history.replaceState(null, '', url.toString());
    } catch (e) {
      setApiError(t(lang, 'cantReachIsItRunning'));
    }
  };

  const startTheGame = () => post('/start', { adminToken });
  const rollDice = () => post('/roll');
  const selectBlindBetType = (type) => post('/blindType', { type });
  const revealBlindTask = () => post('/reveal');

  const currentTaskObject = (state) => {
    if (!state || !state.currentTaskType || state.currentTaskIndex == null) return null;
    const list = state.currentTaskType === 'skill' ? skillTasks : mentalTasks;
    const entry = list[state.currentTaskIndex];
    return { ...entry, text: entry[lang], type: state.currentTaskType };
  };

  const startChallenge = () => {
    const task = currentTaskObject(gs);
    if (task && !task.time) return post('/startChallenge', { noTimeLimit: true });
    return post('/startChallenge', { taskTimeSeconds: (task && task.time) || 30 });
  };

  const placeBet = async (willSucceed, amount) => {
    if (myPlayerId === null) return;
    setBetError(null);
    const result = await post('/bet', { willSucceed, amount });
    if (result.error) setBetError(result.error);
  };

  const recordResult = (success) => post('/result', { success });
  const nextTurn = () => post('/nextTurn');
  const endGame = () => post('/end');

  const renderJoinBar = () => {
    if (myPlayerId !== null || !gs || !gs.players) return null;
    return (
      <div className="bg-yellow-50 border-2 border-yellow-400 rounded-lg p-3 mb-4 text-center">
        <p className="font-semibold mb-2 text-sm">{t(lang, 'tapYourName')}</p>
        <div className="flex flex-wrap gap-2 justify-center">
          {gs.players.map(p => (
            <button
              key={p.id}
              onClick={() => claimPlayer(p.id)}
              className="px-3 py-1 bg-yellow-400 rounded-lg font-semibold hover:bg-yellow-500 text-sm"
            >
              {p.name}
            </button>
          ))}
        </div>
      </div>
    );
  };

  let content;

  if (apiError && !gs) {
    content = (
      <div className="min-h-screen bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center p-4">
        <div className="bg-white rounded-xl shadow-2xl p-8 max-w-md w-full text-center">
          <h1 className="text-2xl font-bold mb-3 text-purple-600">{t(lang, 'cantReachTitle')}</h1>
          <p className="text-gray-600 mb-6">{apiError}</p>
          <button
            onClick={() => window.location.reload()}
            className="w-full bg-purple-600 text-white py-3 rounded-lg font-bold text-lg hover:bg-purple-700 transition"
          >
            {t(lang, 'retry')}
          </button>
        </div>
      </div>
    );
  } else if (loading && !gs) {
    content = (
      <div className="min-h-screen bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center p-4">
        <p className="text-white text-lg font-semibold">{t(lang, 'loadingGame')}</p>
      </div>
    );
  } else if (!gs) {
    content = (
      <div className="min-h-screen bg-gradient-to-br from-purple-600 to-blue-600 flex items-center justify-center p-4">
        <div className="bg-white rounded-xl shadow-2xl p-8 max-w-md w-full">
          <h1 className="text-4xl font-bold text-center mb-6 text-purple-600">{t(lang, 'title')}</h1>

          {localSetup.setupStep === 'config' && (
            <div className="space-y-6">
              <div>

                  <div className="text-center mb-6">

                      {t(lang, 'failedBtn')}

              )}
            </div>
          )}
        </div>
      </div>
    );
  }

  return (
    <>
      <LanguageSwitcher lang={lang} setLang={setLang} />
      {content}
    </>
  );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<BetYouCantGame />);
</script>
</body>
</html>
