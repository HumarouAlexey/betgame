    className={cx(

      BUTTON_VARIANTS[variant], BUTTON_SIZES[size], block && 'w-full', className

  />
);

);

  danger: 'bg-rose-50 text-rose-700',

};
const Notice = ({ tone = 'neutral', className, children }) => (

const Hint = ({ children }) => <p className="mt-3 text-center text-sm text-zinc-500">{children}</p>;

// Asks before an action that can't be undone. Sits at the bottom of the
// screen on phones, where the thumb already is, and centred on desktop.
const ConfirmDialog = ({ title, body, confirmLabel, cancelLabel, onConfirm, onCancel, tone = 'danger' }) => {
  useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') onCancel(); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [onCancel]);
  // Rendered into <body> so no ancestor's stacking or sticky context can
  // clip the backdrop.
  return ReactDOM.createPortal(
    <div
      className="fixed inset-0 z-50 flex items-end justify-center bg-zinc-900/40 p-4 pb-[max(1rem,env(safe-area-inset-bottom))] sm:items-center"
      onClick={onCancel}
    >
      <div
        role="alertdialog"
        aria-modal="true"
        className="w-full max-w-sm rounded-2xl bg-white p-6 shadow-xl"
        onClick={(e) => e.stopPropagation()}
      >
        <h2 className="text-lg font-semibold tracking-tight">{title}</h2>
        <p className="mt-2 text-sm text-zinc-600">{body}</p>
        <div className="mt-6 grid grid-cols-2 gap-2">
          <Button variant="secondary" autoFocus onClick={onCancel}>{cancelLabel}</Button>
          <Button variant={tone} onClick={onConfirm}>{confirmLabel}</Button>
        </div>
      </div>
    </div>,
    document.body
  );
};

const Spinner = () => (

// standings view) and logoActive shows whether that view is open.
const AppShell = ({ lang, setLang, actions, onLogoClick, logoActive, logoLabel, children }) => {
  const logo = (
    <span className="grid h-8 w-8 shrink-0 place-items-center rounded-lg bg-indigo-600 text-sm font-bold text-white">
      {t(lang, 'logoLetter')}
    </span>
  );
  return (
    <div className="flex min-h-[100dvh] flex-col bg-zinc-50 pb-[env(safe-area-inset-bottom)] font-sans text-zinc-900 antialiased">
      <header className="sticky top-0 z-40 border-b border-zinc-200 bg-white/90 pt-[env(safe-area-inset-top)] backdrop-blur">
        <div className="flex h-14 items-center justify-between gap-3 px-4 sm:px-6 lg:px-8">
          <div className="flex min-w-0 items-center gap-2.5">
            {onLogoClick ? (
              <button
                type="button"
                onClick={onLogoClick}
                aria-pressed={!!logoActive}
                aria-label={logoLabel}
                title={logoLabel}
                className={cx(
                  'shrink-0 rounded-lg transition focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:ring-offset-2',
                  logoActive ? 'ring-2 ring-indigo-600 ring-offset-2' : 'hover:opacity-85'
                )}
              >
                {logo}
              </button>
            ) : logo}
            <span className="truncate font-semibold">{t(lang, 'title')}</span>
          </div>
          <div className="flex shrink-0 items-center gap-2">
            {actions}
            <LanguageSwitcher lang={lang} setLang={setLang} />
          </div>
        </div>
      </header>
      <main className="w-full flex-1 px-4 py-4 sm:px-6 sm:py-6 lg:px-8 lg:py-8">{children}</main>
    </div>
  );
};

    <ul className="divide-y divide-zinc-100 rounded-xl border border-zinc-200">
      {players.map(p => (
        <li key={p.id} className="flex items-center justify-between gap-3 px-4 py-2.5 text-sm">
          <span className="truncate font-medium">{p.name}</span>
          {placedBy.includes(p.id)
            ? <Badge tone="success">{t(lang, 'betPlaced')}</Badge>
            : <span className="text-zinc-400">{pendingLabel}</span>}
        </li>
      ))}
    </ul>
  );
};

const inputClass = 'block w-full rounded-xl border border-zinc-300 bg-white px-4 text-base placeholder:text-zinc-400 focus:border-indigo-500 focus:outline-none focus:ring-4 focus:ring-indigo-500/15';

// One button that opens into a name field, so joining is a single obvious
// action whether it happens in the lobby or in the middle of a game.
const JoinForm = ({ onJoin, error, lang }) => {
  const [open, setOpen] = useState(false);
  const [name, setName] = useState('');
  const [busy, setBusy] = useState(false);
  const submit = async (e) => {
    e.preventDefault();
    if (!name.trim() || busy) return;
    setBusy(true);
    await onJoin(name.trim());
    setBusy(false);
  };

  if (!open) {
    return <Button block onClick={() => setOpen(true)}>{t(lang, 'joinGame')}</Button>;
  }
  return (
    <form onSubmit={submit} className="space-y-3">
      <label className="block">
        <span className="mb-1.5 block text-sm font-medium text-zinc-700">{t(lang, 'yourName')}</span>
        <input
          type="text"
          autoFocus
          autoComplete="nickname"
          enterKeyHint="go"
          maxLength={24}
          value={name}
          onChange={(e) => setName(e.target.value)}
          className={cx(inputClass, 'h-12')}
        />
      </label>
      <div className="flex gap-2">
        <Button variant="secondary" onClick={() => setOpen(false)}>{t(lang, 'cancel')}</Button>
        <Button type="submit" className="flex-1" disabled={!name.trim() || busy}>{t(lang, 'joinBtn')}</Button>
      </div>
      {error && <p className="text-sm text-rose-600">{error}</p>}
    </form>
  );
};

const BetForm = ({ player, onBet, error, lang }) => {
  const [amount, setAmount] = useState('');
  if (!player) return null;
  const maxBet = Math.floor(player.money / 2);
  const parsed = parseInt(amount) || 0;
  const canBet = maxBet >= MIN_BET;
  const validAmount = canBet && parsed >= MIN_BET && parsed <= maxBet;
  if (!canBet) {
    return <Notice tone="danger">{t(lang, 'notEnoughForMinBet', MIN_BET)}</Notice>;
  }
  const half = Math.max(MIN_BET, Math.round(maxBet / 2 / MIN_BET) * MIN_BET);
  const presets = [...new Set([MIN_BET, half, maxBet])];
  return (
    <div className="space-y-3">
      <div className="flex items-baseline justify-between gap-3">
        <p className="text-sm font-medium text-zinc-700">{t(lang, 'yourBet')}</p>
        <p className="text-sm text-zinc-500">{t(lang, 'available', player.money)}</p>
      </div>
      <div className="relative">
        <span className="pointer-events-none absolute inset-y-0 left-4 flex items-center text-lg text-zinc-400">€</span>
        <input
          type="number"
          inputMode="numeric"
          min={MIN_BET}
          max={maxBet}
          value={amount}
          placeholder={`${MIN_BET}–${maxBet}`}
          onChange={(e) => setAmount(e.target.value)}
          className={cx(inputClass, 'h-14 pl-9 text-2xl font-semibold tabular-nums')}
        />
      </div>
      <div className="flex gap-2">
        {presets.map(v => (
          <button
            key={v}
            type="button"
            onClick={() => setAmount(String(v))}
            className={cx(
              'h-10 flex-1 rounded-lg border text-sm font-semibold tabular-nums transition-colors',
              parsed === v ? 'border-indigo-600 bg-indigo-50 text-indigo-700' : 'border-zinc-200 bg-white text-zinc-700 hover:border-zinc-300'
            )}
          >
            €{v}
          </button>
        ))}
      </div>
      <div className="grid grid-cols-2 gap-2 pt-1">
        <Button variant="success" disabled={!validAmount} onClick={() => onBet(true, parsed)}>{t(lang, 'yes')}</Button>
        <Button variant="danger" disabled={!validAmount} onClick={() => onBet(false, parsed)}>{t(lang, 'no')}</Button>
      </div>
      <p className="text-xs text-zinc-500">{t(lang, 'betRange', MIN_BET, maxBet)}</p>
      {error && <p className="text-sm text-rose-600">{error}</p>}
    </div>
  );
};

  // player's small array index. That's what stops someone from "becoming"

  const params = new URLSearchParams(window.location.search);
  const urlGameId = params.get('g');
  const urlPlayerToken = params.get('p');

  const [gameId, setGameId] = useState(urlGameId || null);

  // is always something to load first.
  const [loading, setLoading] = useState(true);
  const [apiError, setApiError] = useState(null);
  const [betError, setBetError] = useState(null);
  const [now, setNow] = useState(Date.now());

  // we receive. Deadlines like performEndsAt are in server time, so
  // countdowns compare against serverNow(), not Date.now().

  const serverNow = () => Date.now() + clockOffsetRef.current;
  const applyState = (state) => {
    if (state && state.serverNow) clockOffsetRef.current = state.serverNow - Date.now();
    setGs(state);
  };
  const [joinError, setJoinError] = useState(null);
  const [copied, setCopied] = useState(false);
  // Which irreversible action is waiting for a yes: 'start', 'end' or null.
  const [confirming, setConfirming] = useState(null);
  // The logo toggles a full-page standings view. The game stays mounted
  // underneath (just hidden), so a half-typed bet survives the round trip,
  // and the scroll position is put back on the way out.
  const [showingStandings, setShowingStandings] = useState(false);
  const savedScrollRef = React.useRef(0);
  const toggleStandings = () => {
    if (!showingStandings) savedScrollRef.current = window.scrollY;
    setShowingStandings(v => !v);
  };
  React.useLayoutEffect(() => {
    window.scrollTo(0, showingStandings ? 0 : savedScrollRef.current);
  }, [showingStandings]);

  const [lang, setLang] = useState(() => {
    try {
      const stored = localStorage.getItem('lang');
      if (stored === 'en' || stored === 'ru') return stored;
    } catch (e) {}
    return (navigator.language || '').toLowerCase().startsWith('ru') ? 'ru' : 'en';
  });

  useEffect(() => {
    try { localStorage.setItem('lang', lang); } catch (e) {}
    document.documentElement.lang = lang;
    document.title = t(lang, 'title');
  }, [lang]);

  const apiBase = () => `${window.location.origin}/api/games`;

  // Appends our own player token (so the server knows which bet, if any, is
  // safe to reveal to us) and the current UI language (for translated
  // server-side error messages).
  const viewerQuery = () => {
    const p = new URLSearchParams();
    if (myToken) p.set('playerId', myToken);
    p.set('lang', lang);
    return `?${p.toString()}`;
  };

  // Joins under the typed name: the server adds us as a new player and
  // hands back our secret token, which we then use as our identity.
  const joinGame = async (name) => {
    setJoinError(null);
    try {
      const res = await fetch(`${apiBase()}/${gameId}/join?lang=${lang}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name })
      });
      const data = await res.json();
      if (!res.ok) {
        setJoinError(data.error || t(lang, 'somethingWrong'));
        return;
      }
      setMyToken(data.token);
      applyState(data.state);
      const url = new URL(window.location.href);
      url.searchParams.set('p', data.token);
      window.history.replaceState(null, '', url.toString());
    } catch (e) {
      setJoinError(t(lang, 'connectionError'));
    }
  };

  // The one link everyone shares. It never carries anyone's player
  // token — each phone gets its own token by joining.
  const getShareUrl = () => {
    const url = new URL(window.location.origin + window.location.pathname);
    url.searchParams.set('g', gameId);
    return url.toString();
  };

  const getQrImageUrl = (url) =>
    `https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=${encodeURIComponent(url)}`;

  const copyLink = async () => {
    const url = getShareUrl();
    try {
      await navigator.clipboard.writeText(url);
    } catch (e) {
      try {
        const ta = document.createElement('textarea');
        ta.value = url;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      } catch (e2) {}
    }
    setCopied(true);
    setTimeout(() => setCopied(false), 2000);
  };

  // ---- Polling ----
  useEffect(() => {
    if (!gameId) return;
    let cancelled = false;
    const refresh = async () => {
      try {
        const res = await fetch(`${apiBase()}/${gameId}${viewerQuery()}`);
        if (!res.ok) throw new Error('not found');
        const data = await res.json();
        if (!cancelled) {
          applyState(data);
          setApiError(null);
        }
      } catch (e) {
        if (!cancelled) setApiError(t(lang, 'connectionError'));
      } finally {
        if (!cancelled) setLoading(false);
      }
    };
    refresh();
    const interval = setInterval(refresh, 1500);
    return () => { cancelled = true; clearInterval(interval); };
  }, [gameId, myToken, lang]);

  // Mirrors the server-resolved player index (gs.you, derived from our
  // secret token) into local state so the rest of the UI can keep indexing
  // gs.players[myPlayerId] as before.
  useEffect(() => {
    if (gs && gs.you !== null && gs.you !== undefined) {
      setMyPlayerId(gs.you);
    }
  }, [gs]);

  // Ticks several times a second so a countdown flips close to the real
  // second boundary instead of up to a second late.
  useEffect(() => {
    const tickInterval = setInterval(() => setNow(Date.now()), 250);
    return () => clearInterval(tickInterval);
  }, []);

  // Web Audio beep — no external audio file needed, keeps the app self-contained.
  const audioCtxRef = React.useRef(null);
  const getAudioCtx = () => {
    try {
      if (!audioCtxRef.current) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return null;
        audioCtxRef.current = new Ctx();
      }
      if (audioCtxRef.current.state === 'suspended') {
        audioCtxRef.current.resume().catch(() => {});
      }
      return audioCtxRef.current;
    } catch (e) {
      return null;
    }
  };
  const playTimeUpSound = () => {
    const ctx = getAudioCtx();
    if (!ctx) return;
    try {
      const startTime = ctx.currentTime;
      // A struck gong: every partial starts at once on a near-instant attack,
      // then rings out. The upper ones fade first, which is what makes the
      // strike read as a metallic hit rather than a held chord.
      [
        { freq: 220, peak: 0.35, decay: 1.8 },
        { freq: 330, peak: 0.18, decay: 1.4 },
        { freq: 660, peak: 0.07, decay: 0.5 },
      ].forEach(({ freq, peak, decay }) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0, startTime);
        gain.gain.linearRampToValueAtTime(peak, startTime + 0.005);
        gain.gain.exponentialRampToValueAtTime(0.001, startTime + decay);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(startTime);
        osc.stop(startTime + decay + 0.05);
      });
    } catch (e) {}
  };

  const performAlertedRef = React.useRef(null);
  useEffect(() => {
    if (!gs || gs.phase !== 'performing' || !gs.performEndsAt) return;
    if (serverNow() >= gs.performEndsAt && performAlertedRef.current !== gs.performEndsAt) {
      performAlertedRef.current = gs.performEndsAt;
      playTimeUpSound();
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [now, gs]);

  const post = async (path, body) => {
    try {
      const res = await fetch(`${apiBase()}/${gameId}${path}${viewerQuery()}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body || {})
      });
      const data = await res.json();
      if (!res.ok) {
        return { error: data.error || t(lang, 'somethingWrong') };
      }
      applyState(data);
      setApiError(null);
      return { data };
    } catch (e) {
      setApiError(t(lang, 'connectionError'));
      return { error: t(lang, 'networkError') };
    }
  };

  const createGame = async () => {
    try {
      const res = await fetch(`${apiBase()}/${viewerQuery()}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: '{}'
      });
      const data = await res.json();
      if (!res.ok) {
        setApiError(data.error || t(lang, 'couldNotCreateGame'));
        return;
      }
      setGameId(data.gameId);
      applyState(data.state);
      const url = new URL(window.location.href);
      url.searchParams.set('g', data.gameId);
      window.history.replaceState(null, '', url.toString());
    } catch (e) {
      setApiError(t(lang, 'cantReachIsItRunning'));
    } finally {
      setLoading(false);
    }
  };

  useEffect(() => {
    if (!urlGameId) createGame();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  // Closing the tab mid-game would cost a player their seat (their identity
  // lives only in this page's URL), so the browser asks before leaving.
  const inProgress = !!gs && myPlayerId !== null && gs.phase !== 'lobby' && gs.phase !== 'gameOver';
  useEffect(() => {
    if (!inProgress) return;
    const onBeforeUnload = (e) => { e.preventDefault(); e.returnValue = ''; };
    window.addEventListener('beforeunload', onBeforeUnload);
    return () => window.removeEventListener('beforeunload', onBeforeUnload);
  }, [inProgress]);

  const startTheGame = () => post('/start');
  const rollDice = () => post('/roll');
  const selectBlindBetType = (type) => post('/blindType', { type });
  const revealBlindTask = () => post('/reveal');

  const currentTaskObject = (state) => {
    if (!state || !state.currentTaskType || state.currentTaskIndex == null) return null;
    const list = state.currentTaskType === 'skill' ? skillTasks : mentalTasks;
    const entry = list[state.currentTaskIndex];
    return { ...entry, text: entry[lang], type: state.currentTaskType };
  };

  const startChallenge = () => {
    const task = currentTaskObject(gs);
    if (task && !task.time) return post('/startChallenge', { noTimeLimit: true });
    return post('/startChallenge', { taskTimeSeconds: (task && task.time) || 30 });
  };

  const placeBet = async (willSucceed, amount) => {
    if (myPlayerId === null) return;
    setBetError(null);
    const result = await post('/bet', { willSucceed, amount });
    if (result.error) setBetError(result.error);
  };

  const recordResult = (success) => post('/result', { success });
  const nextTurn = () => post('/nextTurn');
  const endGame = () => post('/end');

  const renderJoinBar = () => {
    if (myPlayerId !== null || !gs || !gs.players) return null;
    return (
      <Card className="p-5 sm:p-6">
        <p className="mb-4 text-sm font-medium text-zinc-700">{t(lang, 'joinLateHint', STARTING_MONEY)}</p>
        <JoinForm onJoin={joinGame} error={joinError} lang={lang} />
      </Card>
    );
  };

  const shell = (children, actions, logoProps) => (
    <AppShell lang={lang} setLang={setLang} actions={actions} {...logoProps}>{children}</AppShell>
  );

  if (apiError && !gs) {
    return shell(
      <div className="grid place-items-center py-12 sm:py-24">
        <Card className="w-full max-w-md p-6 text-center sm:p-8">
          <h1 className="text-xl font-semibold tracking-tight">{t(lang, 'cantReachTitle')}</h1>
          <p className="mt-2 text-sm text-zinc-600">{apiError}</p>
          <Button block className="mt-6" onClick={() => window.location.reload()}>{t(lang, 'retry')}</Button>
        </Card>
      </div>
    );
  }

  if (loading && !gs) {
    return shell(
      <div className="flex flex-col items-center justify-center gap-3 py-24">
        <Spinner />
        <p className="text-sm text-zinc-500">{t(lang, 'loadingGame')}</p>
      </div>
    );
  }

  if (gs.phase === 'lobby') {
    const isMe = myPlayerId !== null && gs.players[myPlayerId];
    const shareUrl = getShareUrl();
    return shell(
      <TwoColumn
        main={<>
          <Card className="p-5 sm:p-8">
            <Eyebrow>{t(lang, 'lobbyTitle')}</Eyebrow>
            <h1 className="mt-1 text-2xl font-semibold tracking-tight sm:text-3xl">{t(lang, 'title')}</h1>
            <p className="mt-2 max-w-2xl text-zinc-600">{t(lang, 'lobbyIntro')}</p>
            <div className="mt-6 max-w-md">
              {isMe
                ? <Notice tone="success">{t(lang, 'youAreIn', gs.players[myPlayerId].name)}</Notice>
                : <JoinForm onJoin={joinGame} error={joinError} lang={lang} />}
            </div>
          </Card>

          <Card>
            <div className="flex items-center justify-between border-b border-zinc-100 px-5 py-4 sm:px-6">
              <h2 className="font-semibold">{t(lang, 'playersJoined')}</h2>
              <Badge>{gs.players.length}</Badge>
            </div>
            {gs.players.length === 0 ? (
              <p className="px-5 py-8 text-center text-sm text-zinc-500 sm:px-6">{t(lang, 'noPlayersYet')}</p>
            ) : (
              <ul className="grid gap-2 p-4 sm:grid-cols-2 sm:p-5 xl:grid-cols-3">
                {gs.players.map(p => (
                  <li key={p.id} className="flex items-center gap-3 rounded-xl border border-zinc-200 px-3 py-2.5">
                    <Avatar name={p.name} />
                    <span className="min-w-0 flex-1 truncate font-medium">{p.name}</span>
                    {p.id === myPlayerId && <Badge>{t(lang, 'youBadge')}</Badge>}
                  </li>
                ))}
              </ul>
            )}
            <div className="border-t border-zinc-100 p-5 sm:p-6">
              {isMe ? (
                <Button block className="sm:w-auto sm:min-w-[220px]" onClick={() => setConfirming('start')} disabled={gs.players.length === 0}>
                  {t(lang, 'startGame')}
                </Button>
              ) : (
                <Notice>{t(lang, 'joinToStart')}</Notice>
              )}
              {apiError && <p className="mt-3 text-sm text-rose-600">{apiError}</p>}
            </div>
          </Card>
          {confirming === 'start' && isMe && (
            <ConfirmDialog
              tone="primary"
              title={t(lang, 'startGameConfirmTitle')}
              body={t(lang, 'startGameConfirmBody', gs.players.length)}
              confirmLabel={t(lang, 'startGameConfirmBtn')}
              cancelLabel={t(lang, 'cancel')}
              onConfirm={() => { setConfirming(null); startTheGame(); }}
              onCancel={() => setConfirming(null)}
            />
          )}
        </>}
        side={<>
          <Card className="p-5 sm:p-6">
            <h2 className="font-semibold">{t(lang, 'inviteTitle')}</h2>
            <p className="mt-1 text-sm text-zinc-500">{t(lang, 'inviteHint')}</p>
            <div className="mx-auto mt-5 w-fit rounded-xl border border-zinc-200 bg-white p-3">
              <img src={getQrImageUrl(shareUrl)} alt={t(lang, 'qrAlt')} width={200} height={200} className="block" />
            </div>
            <div className="mt-5 flex gap-2">
              <input
                readOnly
                value={shareUrl}
                onFocus={(e) => e.target.select()}
                className="h-11 min-w-0 flex-1 rounded-xl border border-zinc-200 bg-zinc-50 px-3 text-sm text-zinc-600 focus:outline-none"
              />
              <Button variant="secondary" size="md" onClick={copyLink}>
                {copied ? t(lang, 'copied') : t(lang, 'copyLink')}
              </Button>
            </div>
          </Card>

          <Card className="p-5 sm:p-6">
            <h2 className="font-semibold">{t(lang, 'howToPlayTitle')}</h2>
            <ol className="mt-3 space-y-2 text-sm text-zinc-600">
              {['howToPlay1', 'howToPlay2', 'howToPlay3', 'howToPlay4'].map((key, i) => (
                <li key={key} className="flex gap-3">
                  <span className="w-4 shrink-0 font-semibold tabular-nums text-zinc-400">{i + 1}</span>
                  <span>{t(lang, key)}</span>
                </li>
              ))}
            </ol>
          </Card>
          <p className="px-1 text-xs text-zinc-400">{t(lang, 'sameNetworkNote')}</p>
        </>}
      />
    );
  }

  if (gs.phase === 'gameOver') {
    const rankedPlayers = [...gs.players].sort(byMoneyThenName);
    const winner = rankedPlayers[0];
    return shell(
      <div className="mx-auto w-full max-w-xl py-4 sm:py-12">
        <Card className="p-6 sm:p-8">
          <Eyebrow>{t(lang, 'gameOverTitle')}</Eyebrow>
          <h1 className="mt-1 text-2xl font-semibold tracking-tight sm:text-3xl">
            {winner ? t(lang, 'winnerLabel', winner.name) : t(lang, 'gameOverTitle')}
          </h1>
          <ol className="mt-6 divide-y divide-zinc-100 overflow-hidden rounded-xl border border-zinc-200">
            {rankedPlayers.map((player, index) => (
              <li key={player.id} className={cx('flex items-center gap-3 px-4 py-3', index === 0 && 'bg-indigo-50/60')}>
                <span className="w-6 text-sm font-semibold tabular-nums text-zinc-400">{index + 1}</span>
                <span className="min-w-0 flex-1 truncate font-medium">{player.name}</span>
                <span className="font-semibold tabular-nums">€{player.money}</span>
              </li>
            ))}
          </ol>
          <Button block className="mt-6" onClick={() => window.location.href = window.location.origin + window.location.pathname}>
            {t(lang, 'playAgain')}
          </Button>
        </Card>
      </div>
    );
  }

  const currentTask = currentTaskObject(gs);
  const currentPlayer = gs.players[gs.currentPlayerIndex];
  const taskTimeText = (task) => (task.time ? t(lang, 'timeLimit', task.time) : t(lang, 'noTimeLimit'));
  // Capped at the task's own limit, so a 30-second task never shows 31.
  const challengeTimeLeft = gs.performEndsAt
    ? Math.min(
        currentTask && currentTask.time ? currentTask.time : Infinity,
        Math.max(0, Math.ceil((gs.performEndsAt - serverNow()) / 1000))
      )
    : null;
  const iAmCurrent = myPlayerId === gs.currentPlayerIndex;
  const otherPlayers = gs.players.filter((_, i) => i !== gs.currentPlayerIndex);
  const betsCount = gs.betsCount || 0;
  const betPlacedBy = gs.betPlacedBy || [];
  const betsNeeded = gs.players.length - 1;
  const myBet = myPlayerId !== null ? (gs.bets || {})[myPlayerId] : undefined;
  const waitingContinue = !iAmCurrent && <Hint>{t(lang, 'waitingContinue', currentPlayer.name)}</Hint>;
  const typeLabel = (type) => (type === 'skill' ? t(lang, 'skillChallenge') : t(lang, 'mentalChallenge'));

  let phaseView = null;

  if (gs.phase === 'playing') {
    phaseView = (
      <Panel title={iAmCurrent ? t(lang, 'yourTurn') : t(lang, 'turnOf', currentPlayer.name)}>
        <div className="flex flex-col items-center py-4 text-center sm:py-8">
          {gs.diceValue && (
            <div className="mb-6">
              <div className="mx-auto grid h-24 w-24 place-items-center rounded-2xl border-2 border-zinc-900 text-5xl font-bold tabular-nums">
                {gs.diceValue}
              </div>
              <p className="mt-3 text-zinc-600">{t(lang, 'rolled', gs.diceValue)}</p>
            </div>
          )}
          <Button block className="sm:w-auto sm:min-w-[240px]" onClick={rollDice} disabled={gs.diceValue !== null || !iAmCurrent}>
            {t(lang, 'rollDice')}
          </Button>
          {!iAmCurrent && <Hint>{t(lang, 'waitingRoll', currentPlayer.name)}</Hint>}
        </div>
      </Panel>
    );
  } else if (gs.phase === 'blindBet') {
    phaseView = (
      <Panel
        eyebrow={t(lang, 'blindBetTitle')}
        title={iAmCurrent ? t(lang, 'chooseChallengeType') : t(lang, 'chooseChallengeTypeOther', currentPlayer.name)}
      >
        <Notice tone="warning" className="mb-6">{t(lang, 'blindBetWarning')}</Notice>
        <div className="grid gap-3 sm:grid-cols-2">
          {[['skill', 'skillTaskBtn'], ['mental', 'mentalTaskBtn']].map(([type, key]) => (
            <button
              key={type}
              type="button"
              onClick={() => selectBlindBetType(type)}
              disabled={!iAmCurrent}
              className="rounded-xl border border-zinc-200 bg-white p-5 text-left transition-colors hover:border-indigo-500 hover:bg-indigo-50/40 disabled:cursor-not-allowed disabled:opacity-50 disabled:hover:border-zinc-200 disabled:hover:bg-white"
            >
              <span className="block text-base font-semibold">{t(lang, key)}</span>
            </button>
          ))}
        </div>
        {waitingContinue}
      </Panel>
    );
  } else if (gs.phase === 'betting' || gs.phase === 'blindBetting') {
    const isBlind = gs.phase === 'blindBetting';
    phaseView = (
      <Panel
        eyebrow={isBlind ? t(lang, 'blindBettingTitle') : typeLabel(gs.currentTaskType)}
        title={isBlind
          ? `${currentPlayer.name} ${t(lang, 'hasChosen')} ${gs.blindBetTaskType === 'skill' ? t(lang, 'skillChallengeLower') : t(lang, 'mentalChallengeLower')}`
          : null}
      >
        {isBlind
          ? <Notice tone="warning" className="mb-6">{t(lang, 'blindBettingWarning')}</Notice>
          : currentTask
            ? <div className="mb-6"><TaskCard text={currentTask.text} meta={taskTimeText(currentTask)} /></div>
            : <div className="mb-6"><TaskCard muted text={t(lang, 'taskHiddenUntilBets')} /></div>}

        <div className="grid gap-6 lg:grid-cols-2">
          <div>
            {iAmCurrent ? (
              <Notice tone="accent">{t(lang, 'waitingOnBets', betsCount, betsNeeded)}</Notice>
            ) : myPlayerId === null ? null : myBet ? (
              <Notice tone="success">
                {t(lang, 'youBet', myBet.amount, myBet.willSucceed ? t(lang, 'success') : t(lang, 'fail'))}
              </Notice>
            ) : (
              <BetForm player={gs.players[myPlayerId]} onBet={placeBet} error={betError} lang={lang} />
            )}
          </div>
          <div>
            <div className="mb-2 flex items-baseline justify-between gap-3">
              <h3 className="text-sm font-semibold">{t(lang, 'betsPlacedCount', betsCount, betsNeeded)}</h3>
            </div>
            <BetStatusList players={otherPlayers} placedBy={betPlacedBy} pendingLabel={t(lang, 'thinking')} lang={lang} />
            <p className="mt-2 text-xs text-zinc-400">{t(lang, 'betsSecretNote')}</p>
          </div>
        </div>

        <div className="mt-6 border-t border-zinc-100 pt-6">
          <Button block onClick={isBlind ? revealBlindTask : startChallenge} disabled={betsCount < betsNeeded || !iAmCurrent}>
            {isBlind ? t(lang, 'allBetsRevealChallenge') : t(lang, 'allBetsStartChallenge')}
          </Button>
          {betsCount >= betsNeeded && waitingContinue}
        </div>
      </Panel>
    );
  } else if (gs.phase === 'revealBlindTask' && currentTask) {
    phaseView = (
      <Panel eyebrow={typeLabel(currentTask.type)} title={t(lang, 'challengeRevealed')}>
        <TaskCard text={currentTask.text} meta={taskTimeText(currentTask)} />
        <div className="mt-6">
          <h3 className="mb-2 text-sm font-semibold">{t(lang, 'betsPlacedTitle')}</h3>
          <BetStatusList players={otherPlayers} placedBy={betPlacedBy} pendingLabel="—" lang={lang} />
          <p className="mt-2 text-xs text-zinc-400">{t(lang, 'betsSecretNote')}</p>
        </div>
        <div className="mt-6 border-t border-zinc-100 pt-6">
          <Button block onClick={startChallenge} disabled={!iAmCurrent}>{t(lang, 'startChallengeBtn')}</Button>
          {waitingContinue}
        </div>
      </Panel>
    );
  } else if (gs.phase === 'performing' && currentTask) {
    const total = currentTask.time || 0;
    const progress = total && challengeTimeLeft !== null ? Math.min(100, (challengeTimeLeft / total) * 100) : 0;
    phaseView = (
      <Panel
        eyebrow={typeLabel(currentTask.type)}
        title={iAmCurrent ? t(lang, 'youPerforming') : t(lang, 'otherPerforming', currentPlayer.name)}
      >
        <TaskCard text={currentTask.text} />

        {!gs.showResults && (
          <div className="mt-6">
            {challengeTimeLeft !== null ? (
              <div>
                <p className={cx('text-3xl font-semibold tabular-nums', challengeTimeLeft === 0 ? 'text-rose-600' : 'text-zinc-900')}>
                  {t(lang, 'secondsLeft', challengeTimeLeft)}
                </p>
                <div className="mt-3 h-2 overflow-hidden rounded-full bg-zinc-100">
                  <div className="h-full rounded-full bg-indigo-600 transition-[width] duration-1000 ease-linear" style={{ width: `${progress}%` }} />
                </div>
              </div>
            ) : (
              <p className="text-sm text-zinc-500">{t(lang, 'noTimeLimit')}</p>
            )}
          </div>
        )}

        {!gs.showResults && (
          <div className="mt-6 border-t border-zinc-100 pt-6">
            {iAmCurrent ? (
              <>
                <p className="font-semibold">{t(lang, 'didYouSucceed')}</p>
                <p className="mt-1 text-sm text-zinc-500">{t(lang, 'onlyYouJudge')}</p>
                <div className="mt-4 grid grid-cols-2 gap-3">
                  <Button variant="success" onClick={() => recordResult(true)}>{t(lang, 'successBtn')}</Button>
                  <Button variant="danger" onClick={() => recordResult(false)}>{t(lang, 'failedBtn')}</Button>
                </div>
              </>
            ) : (
              <Notice>{t(lang, 'waitingResult', currentPlayer.name)}</Notice>
            )}
          </div>
        )}

        {gs.showResults && (
          <div className="mt-6 border-t border-zinc-100 pt-6">
            <div className="mb-3 flex items-center justify-between gap-3">
              <h3 className="font-semibold">{t(lang, 'resultsTitle')}</h3>
              <Badge tone={gs.taskSuccess ? 'success' : 'danger'}>
                {gs.taskSuccess ? t(lang, 'taskCompleted') : t(lang, 'taskFailed')}
              </Badge>
            </div>
            {Object.keys(gs.bets || {}).length > 0 && (
              <ul className="divide-y divide-zinc-100 rounded-xl border border-zinc-200">
                {Object.entries(gs.bets || {}).map(([playerId, bet]) => {
                  const player = gs.players[parseInt(playerId)];
                  const won = bet.willSucceed === gs.taskSuccess;
                  return (
                    <li key={playerId} className="flex items-center justify-between gap-3 px-4 py-2.5 text-sm">
                      <span className="truncate font-medium">{player.name}</span>
                      <span className={cx('font-semibold tabular-nums', won ? 'text-emerald-600' : 'text-rose-600')}>
                        {won ? `+€${bet.amount}` : `−€${bet.amount}`}
                      </span>
                    </li>
                  );
                })}
              </ul>
            )}
            {(gs.rescued || []).map(pid => (
              <Notice key={pid} tone="success" className="mt-3">
                {pid === myPlayerId
                  ? t(lang, 'rescuedYou', RESCUE_AMOUNT)
                  : t(lang, 'rescuedOther', gs.players[pid].name, RESCUE_AMOUNT)}
              </Notice>
            ))}
            <Button block className="mt-6" onClick={nextTurn} disabled={!iAmCurrent}>{t(lang, 'continueBtn')}</Button>
            {waitingContinue}
          </div>
        )}
      </Panel>
    );
  }

  return shell(
    <>
      {showingStandings && (
        <div className="mx-auto w-full max-w-2xl space-y-4">
          <Standings players={gs.players} currentId={gs.currentPlayerIndex} myId={myPlayerId} lang={lang} />
          <Button variant="secondary" block onClick={toggleStandings}>{t(lang, 'backToGame')}</Button>
        </div>
      )}
      <div className={cx('space-y-4 lg:space-y-6', showingStandings && 'hidden')}>
        {renderJoinBar()}
        {apiError && <Notice tone="danger">{apiError}</Notice>}
        {phaseView}
        {confirming === 'end' && iAmCurrent && (
          <ConfirmDialog
            title={t(lang, 'endGameConfirmTitle')}
            body={t(lang, 'endGameConfirmBody')}
            confirmLabel={t(lang, 'endGameConfirmBtn')}
            cancelLabel={t(lang, 'cancel')}
            onConfirm={() => { setConfirming(null); endGame(); }}
            onCancel={() => setConfirming(null)}
          />
        )}
      </div>
    </>,
    iAmCurrent && <Button variant="ghost" size="sm" onClick={() => setConfirming('end')}>{t(lang, 'endGame')}</Button>,
    {
      onLogoClick: toggleStandings,
      logoActive: showingStandings,
      logoLabel: showingStandings ? t(lang, 'backToGame') : t(lang, 'showStandings'),
    }
  );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<BetYouCantGame />);
</script>
</body>
</html>
